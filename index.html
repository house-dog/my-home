<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハウスドッグ・マイページ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f8ff; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #0077b6; font-size: 1.5rem; margin: 0; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 5px solid #00b4d8; display: none; }
        .card-title { font-weight: bold; color: #0077b6; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; font-size: 1.1rem; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e0f2f1; }
        .info-row:last-child { border-bottom: none; }
        .label { color: #666; font-size: 0.9rem; }
        .value { font-weight: 500; color: #333; text-align: right; }
        .app-item { background: #f9feff; border: 1px solid #caf0f8; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 0.9rem; }
        #loading { text-align: center; padding-top: 50px; color: #0077b6; }

        /* メンテナンス履歴専用スタイル */
        details { background: #f9feff; border: 1px solid #caf0f8; border-radius: 12px; margin-bottom: 12px; outline: none; transition: background 0.3s; list-style: none; }
        details[open] { background: #fff; }
        
        /* 元々の黒い三角矢印を消す（Safari/Chrome両方） */
        summary { display: block; padding: 15px; cursor: pointer; outline: none; list-style: none; }
        summary::-webkit-details-marker { display: none; }

        .summary-inner { display: flex; justify-content: space-between; align-items: center; }
        .summary-title-set { display: flex; flex-direction: column; gap: 2px; }
        .summary-date {font-size: 0.9rem;color: #333;font-weight: 500;}
        .summary-text {font-weight: bold;color: #0077b6;font-size: 1rem;}
        .history-content {padding: 8px 15px 12px 15px;font-size: 0.9rem;line-height: 1.4;color: #444;white-space: pre-wrap;border-top: 1px dashed #e0f2f1;margin-top: -5px;padding-top: 8px;}
        .history-memo {margin-top: 5px;padding: 6px 10px;background: #f0f8ff;border-radius: 4px;font-size: 0.8em;}
    </style>
</head>
<body>

<div id="loading"><i class="fas fa-spinner fa-spin"></i> 読み込み中...</div>

<div id="main-content">
    <div class="header">
        <h1><i class="fas fa-home"></i> マイページ</h1>
        <p id="user-name">読み込み中...</p>
    </div>

    <div class="card" id="card-basic">
        <div class="card-title"><i class="fas fa-faucet"></i> 設備設置状況</div>
        <div class="info-row"><span class="label">UFB DUAL設置日</span><span class="value" id="ufb-date">-</span></div>
    </div>

    <div class="card" id="card-solar" style="border-left-color: #48cae4;">
        <div class="card-title"><i class="fas fa-sun"></i> 太陽光・蓄電池</div>
        <div class="info-row"><span class="label">太陽光パネル</span><span class="value" id="solar-info">-</span></div>
        <div class="info-row"><span class="label">設置日</span><span class="value" id="solar-date">-</span></div>
        <div class="info-row"><span class="label">蓄電池</span><span class="value" id="battery-info">-</span></div>
    </div>

    <div class="card" id="card-kyutoki" style="border-left-color: #90e0ef;">
        <div class="card-title"><i class="fas fa-hot-tub"></i> 給湯器情報</div>
        <div id="kyutoki-content"></div>
    </div>

    <div class="card" id="card-apps" style="border-left-color: #0096c7;">
        <div class="card-title"><i class="fas fa-shopping-cart"></i> 家電購入履歴</div>
        <div id="app-history"></div>
    </div>

    <div class="card" id="card-history" style="border-left-color: #00b4d8; display: none;">
        <div class="card-title"><i class="fas fa-history"></i> メンテナンス履歴</div>
        <div id="history-list"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBT-mS9I2WEp5N1zbuz3zbuL6I79K6Amx0",
    authDomain: "house-dog.firebaseapp.com",
    databaseURL: "https://house-dog-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "house-dog",
    storageBucket: "house-dog.firebasestorage.app",
    messagingSenderId: "273035019029",
    appId: "1:273035019029:web:d207593957151568a39f1c"
};
const LIFF_ID = "1657824671-i9hMmXZT"; 

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

async function main() {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
        liff.login();
        return;
    }

    const profile = await liff.getProfile();
    const userId = profile.userId;
    document.getElementById('user-name').innerText = `${profile.displayName} 様、こんにちは！`;

    database.ref('maintenance_history/' + userId).once('value', (histSnapshot) => {
        const histData = histSnapshot.val();
        const historyCard = document.getElementById('card-history');
        const historyList = document.getElementById('history-list');
        
        if (histData) {
            historyCard.style.display = 'block';
            historyList.innerHTML = "";
            
            const sortedHist = Object.values(histData).reverse();
            sortedHist.forEach(item => {
                const details = document.createElement('details');
                const lines = item.content.split(/\r?\n/);
                const titleText = lines[0];
                const detailText = lines.slice(1).join('\n');
                
                const summary = document.createElement('summary');
                summary.innerHTML = `
                <div class="summary-inner"><div class="summary-title-set" style="flex: 1;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-right: 10px;">
                <span class="summary-date">${item.date}</span>
                <i class="fas fa-chevron-down" style="color: #00b4d8; font-size: 0.8rem;"></i>
                </div>
                <div class="summary-text" style="margin-top: 4px;">${titleText}</div>
                </div>
                </div>
                `;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'history-content';
                contentDiv.innerHTML = `
                    <div>${detailText || '詳細は1行目に記載されています'}</div>
                    ${item.memo ? `<div class="history-memo">備考: ${item.memo}</div>` : ''}
                `;
                
                details.appendChild(summary);
                details.appendChild(contentDiv);
                historyList.appendChild(details);
            });
        }
    });

    database.ref('equipment_master/' + userId).once('value', (snapshot) => {
        const data = snapshot.val();
        document.getElementById('loading').style.display = 'none';
        if (!data) return;
        showData(data);
    });
}

function showData(data) {
    document.getElementById('card-basic').style.display = 'block';
    document.getElementById('ufb-date').innerText = data.ufb || "-";

    if (data.solar || data.battery) {
        document.getElementById('card-solar').style.display = 'block';
        document.getElementById('solar-info').innerText = data.solar || "-";
        document.getElementById('solar-date').innerText = data.solarDate || "-";
        document.getElementById('battery-info').innerText = data.battery || "-";
    }

    if (data.kyutoki) {
        document.getElementById('card-kyutoki').style.display = 'block';
        document.getElementById('kyutoki-content').innerHTML = `<div class="info-row"><span class="value" style="text-align:left;">${data.kyutoki}</span></div>`;
    }

    if (data.homeAppHistory && data.homeAppHistory.length > 0) {
        document.getElementById('card-apps').style.display = 'block';
        const appList = document.getElementById('app-history');
        appList.innerHTML = "";
        data.homeAppHistory.forEach(item => {
            const div = document.createElement('div');
            div.className = 'app-item';
            div.innerHTML = `<strong>${item.product} (${item.maker})</strong><br>
                             <small>型番: ${item.model} / 設置: ${item.installDate}</small><br>
                             <span style="color: #0077b6;">延長保証: ${item.warranty}</span>`;
            appList.appendChild(div);
        });
    }
}

main();
</script>
</body>
</html>

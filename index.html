<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハウスドッグ・マイページ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f8ff; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #0077b6; font-size: 1.5rem; margin: 0; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 5px solid #00b4d8; display: none; }
        .card-title { font-weight: bold; color: #0077b6; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; font-size: 1.1rem; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e0f2f1; }
        .info-row:last-child { border-bottom: none; }
        .label { color: #666; font-size: 0.9rem; }
        .value { font-weight: 500; color: #333; text-align: right; }
        .app-item {background: #ffffff;border: 1px solid #e0f2f1;border-radius: 12px;padding: 15px;margin-bottom: 12px;box-shadow: inset 0 0 0 1px #e0f7fa; /* 爽やかな内枠線 */line-height: 1.5;}
        #loading { text-align: center; padding-top: 50px; color: #0077b6; }
        summary { display: block; padding: 15px; cursor: pointer; outline: none; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        details { background: #f9feff; border: 1px solid #caf0f8; border-radius: 12px; margin-bottom: 12px; outline: none; }
        .summary-inner { display: flex; justify-content: space-between; align-items: center; }
        .summary-text { font-weight: bold; color: #0077b6; font-size: 1rem; }
        .history-content { padding: 8px 15px 12px 15px; font-size: 0.9rem; line-height: 1.4; white-space: pre-wrap; border-top: 1px dashed #e0f2f1; }
    </style>
</head>
<body>

<!-- 読み込み中は1つだけにします -->
<div id="loading"><i class="fas fa-spinner fa-spin"></i> 読み込み中...</div>

<div id="main-content">
    <div class="header">
        <h1><i class="fas fa-home"></i> マイページ</h1>
        <p id="user-name">読み込み中...</p>
    </div>

    <!-- 連携フォーム -->
    <div id="link-form" style="display: none; padding: 20px; text-align: center;">
        <div class="card" style="border-left-color: #ff9f1c; display: block;">
            <div class="card-title"><i class="fas fa-link"></i> お客様情報の連携</div>
            <p style="font-size: 0.9rem; color: #666; text-align: left;">
                お客様情報が見つかりません。ご登録いただいている「電話番号（本人またはご家族）」を入力してください。
            </p>
            <input type="tel" id="input-id" placeholder="例：09012345678" 
                   style="width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem;">
            <button onclick="handleLink()" 
                    style="width: 100%; padding: 12px; background: #00b4d8; color: white; border: none; border-radius: 8px; font-weight: bold;">
                連携する
            </button>
            <p id="link-error" style="color: #e63946; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- 各種カード（初期は非表示） -->
    <div class="card" id="card-basic">
        <div class="card-title"><i class="fas fa-faucet"></i> 設備設置状況</div>
        <div class="info-row"><span class="label">UFB DUAL設置日</span><span class="value" id="ufb-date">-</span></div>
    </div>
    <div class="card" id="card-solar" style="border-left-color: #48cae4;">
        <div class="card-title"><i class="fas fa-sun"></i> 太陽光・蓄電池</div>
        <div class="info-row"><span class="label">太陽光パネル</span><span class="value" id="solar-info">-</span></div>
        <div class="info-row"><span class="label">設置日</span><span class="value" id="solar-date">-</span></div>
        <div class="info-row"><span class="label">蓄電池</span><span class="value" id="battery-info">-</span></div>
    </div>
    <div class="card" id="card-kyutoki" style="border-left-color: #90e0ef;">
        <div class="card-title"><i class="fas fa-hot-tub"></i> 給湯器情報</div>
        <div id="kyutoki-content"></div>
    </div>
    <div class="card" id="card-apps" style="border-left-color: #0096c7;">
        <div class="card-title"><i class="fas fa-shopping-cart"></i> 家電購入履歴</div>
        <div id="app-history"></div>
    </div>
    <div class="card" id="card-history" style="border-left-color: #00b4d8;">
        <div class="card-title"><i class="fas fa-history"></i> メンテナンス履歴</div>
        <div id="history-list"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBT-mS9I2WEp5N1zbuz3zbuL6I79K6Amx0",
    authDomain: "house-dog.firebaseapp.com",
    databaseURL: "https://house-dog-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "house-dog",
    storageBucket: "house-dog.firebasestorage.app",
    messagingSenderId: "273035019029",
    appId: "1:273035019029:web:d207593957151568a39f1c"
};
const LIFF_ID = "1657824671-i9hMmXZT"; 

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

async function main() {
    try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }

        const profile = await liff.getProfile();
        const userId = profile.userId;
        document.getElementById('user-name').innerText = `${profile.displayName} 様、こんにちは！`;

        // 設備データの確認
        database.ref('equipment_master/' + userId).once('value', (snapshot) => {
            document.getElementById('loading').style.display = 'none';
            const data = snapshot.val();
            
            if (!data) {
                document.getElementById('link-form').style.display = 'block';
            } else {
                showData(data);
                // データがある場合のみ履歴を取得
                loadHistory(userId);
            }
        }, (error) => {
            console.error(error);
            document.getElementById('loading').innerText = "通信エラーが発生しました。";
        });

    } catch (err) {
        console.error(err);
        document.getElementById('loading').innerText = "初期化に失敗しました。";
    }
}

function loadHistory(userId) {
    database.ref('maintenance_history/' + userId).once('value', (snapshot) => {
        const histData = snapshot.val();
        if (!histData) return;
        
        const historyCard = document.getElementById('card-history');
        const historyList = document.getElementById('history-list');
        historyCard.style.display = 'block';
        historyList.innerHTML = "";
        
        Object.values(histData).reverse().forEach(item => {
            const details = document.createElement('details');
            const lines = item.content.split(/\r?\n/);
            const summary = document.createElement('summary');
            summary.innerHTML = `<div class="summary-inner"><div><span style="font-size:0.8rem;">${item.date}</span><br><span class="summary-text">${lines[0]}</span></div><i class="fas fa-chevron-down"></i></div>`;
            const content = document.createElement('div');
            content.className = 'history-content';
            content.innerHTML = `<div>${lines.slice(1).join('<br>')}</div>`;
            details.appendChild(summary);
            details.appendChild(content);
            historyList.appendChild(details);
        });
    });
}

function handleLink() { // ← fを1つ削りました
    const inputTel = document.getElementById('input-id').value.trim();
    const errorEl = document.getElementById('link-error');
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwfLQ-DKfqjejR5JZSeE8Dw9Du10b_zXWivlvB_mW-KLlyCMaBsGX2K6tLdTH8DqJGf/exec"; 

    if (!inputTel) { errorEl.innerText = "電話番号を入力してください。"; return; }

    errorEl.innerText = "連携処理中...";

    liff.getProfile().then(profile => {
        // GASへデータを送信
        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({
                phoneNumber: inputTel,
                lineUid: profile.userId
            })
        })
        .then(response => {
            // GASからのリダイレクト等の影響でレスポンスが正常に受け取れない場合の保険
            if (!response.ok) throw new Error('Network response was not ok');
            return response.json();
        })
        .then(res => {
            if (res.success) {
                alert("連携に成功しました！");
                location.reload();
            } else {
                errorEl.innerText = res.message;
            }
        })
        .catch(err => {
            console.error(err);
            // 実際は成功していても、CORSエラーでここに来る場合があります。
            // その場合は「連携リクエストを送りました。しばらくしてから再読み込みしてください」と表示するのが親切です。
            errorEl.innerText = "通信エラーが発生しましたが、処理は受け付けられた可能性があります。数分後に再読み込みをお試しください。";
        });
    });
}
function showData(data) {
    document.getElementById('card-basic').style.display = 'block';
    document.getElementById('ufb-date').innerText = data.ufb || "-";
    
    if (data.solar || data.battery) {
        document.getElementById('card-solar').style.display = 'block';
        document.getElementById('solar-info').innerText = data.solar || "-";
        document.getElementById('solar-date').innerText = data.solarDate || "-";
        document.getElementById('battery-info').innerText = data.battery || "-";
    }
    
    if (data.kyutoki) {
        document.getElementById('card-kyutoki').style.display = 'block';
        document.getElementById('kyutoki-content').innerHTML = `<div class="info-row" style="justify-content: flex-start;">${data.kyutoki}</div>`;
    }

    // 家電購入履歴の修正
    if (data.homeAppHistory) {
        document.getElementById('card-apps').style.display = 'block';
        const list = document.getElementById('app-history');
        
        list.innerHTML = data.homeAppHistory.map(item => `
            <div class="app-item">
                <b style="font-size: 1.1rem;">${item.product} (${item.maker || '-'})</b>
                <div style="margin-top: 5px; color: #666; font-size: 0.9rem;">
                    型番: ${item.model || '-'}<br>
                    設置日: ${item.installDate || '-'}
                </div>
                <div style="margin-top: 5px; color: #0077b6; font-weight: bold;">
                    延長保証: ${item.warranty || '-'}
                </div>
            </div>
        `).join('');
    }
}

main();
</script>
</body>
</html>
